<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="holes3" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.7" fill="#c6bfae"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#1c1c1c">図3　システム全体の完成図（HO-4・HO-5 完成形）</text>

  <!-- laptop -->
  <rect x="50" y="130" width="300" height="196" rx="8" fill="#2b3038"/>
  <rect x="62" y="142" width="276" height="172" rx="3" fill="#f8f8f6"/>
  <rect x="62" y="142" width="276" height="22" rx="3" fill="#e2e2df"/>
  <circle cx="75" cy="153" r="3.5" fill="#b9b9b5"/>
  <circle cx="86" cy="153" r="3.5" fill="#b9b9b5"/>
  <circle cx="97" cy="153" r="3.5" fill="#b9b9b5"/>
  <rect x="110" y="147" width="180" height="12" rx="6" fill="#ffffff"/>
  <text x="118" y="157" font-size="8" fill="#8a8a86">https://…github.io/starter/</text>
  <text x="76" y="186" font-size="13" font-weight="700" fill="#1c1c1c">AI ブリッジ</text>
  <rect x="76" y="194" width="66" height="20" rx="5" fill="#2e86c1"/>
  <text x="109" y="208" font-size="11" fill="#ffffff" text-anchor="middle">接続</text>
  <text x="76" y="238" font-size="15" font-weight="700" fill="#1c1c1c">24.8 ℃ ／ 52.3 %</text>
  <rect x="76" y="248" width="248" height="52" rx="5" fill="#eef4fa" stroke="#b8d4ea"/>
  <text x="86" y="268" font-size="11" fill="#1c4b70">AI：「湿度が高めです。換気を」</text>
  <text x="86" y="288" font-size="11" fill="#1c4b70">{ "servo": 120, "msg": "換気推奨" }</text>
  <polygon points="34,326 366,326 390,348 10,348" fill="#3b4149"/>
  <text x="200" y="374" font-size="14" font-weight="600" fill="#1c1c1c" text-anchor="middle">PC（Chrome 148 以上）</text>

  <!-- gemini callout -->
  <rect x="50" y="394" width="300" height="60" rx="10" fill="#f3efff" stroke="#c3b4ef" stroke-width="1.5"/>
  <text x="200" y="418" font-size="13" font-weight="700" fill="#4b3a95" text-anchor="middle">Prompt API → Gemini Nano</text>
  <text x="200" y="440" font-size="11.5" fill="#5a4aa5" text-anchor="middle">推論は端末の中で完結（ネット接続不要）</text>
  <line x1="200" y1="380" x2="200" y2="392" stroke="#8f7fd6" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- usb cable -->
  <path d="M392 300 L500 300" fill="none" stroke="#7f7f7f" stroke-width="7" stroke-linecap="round"/>
  <text x="446" y="284" font-size="11.5" font-weight="700" fill="#333" text-anchor="middle">USB</text>
  <text x="446" y="330" font-size="11" fill="#555" text-anchor="middle">Web Serial</text>

  <!-- core2 -->
  <rect x="492" y="374" width="196" height="42" rx="10" fill="#565d67"/>
  <rect x="500" y="180" width="180" height="200" rx="14" fill="#383d45"/>
  <rect x="518" y="200" width="144" height="112" rx="6" fill="#0d1218"/>
  <text x="590" y="238" font-size="16" font-weight="700" fill="#5fd3f3" text-anchor="middle">24.8℃ 52.3%</text>
  <text x="590" y="266" font-size="13" fill="#7ce0b0" text-anchor="middle">換気推奨</text>
  <text x="590" y="292" font-size="12" fill="#e2b423" text-anchor="middle">servo 120°</text>
  <rect x="522" y="332" width="38" height="9" rx="4.5" fill="#6c737c"/>
  <rect x="571" y="332" width="38" height="9" rx="4.5" fill="#6c737c"/>
  <rect x="620" y="332" width="38" height="9" rx="4.5" fill="#6c737c"/>
  <rect x="565" y="166" width="50" height="16" rx="3" fill="#c0392b"/>
  <rect x="680" y="286" width="14" height="34" rx="3" fill="#242424"/>
  <text x="590" y="442" font-size="14" font-weight="600" fill="#1c1c1c" text-anchor="middle">M5Stack Core2 for AWS</text>
  <text x="590" y="462" font-size="11" fill="#666" text-anchor="middle">PORT.A ＝ センサー ／ PORT.B ＝ サーボ信号</text>

  <!-- grove A to ENV III -->
  <path d="M590 166 L590 136 L700 136 L700 162 L742 162" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M590 166 L590 136 L700 136 L700 162 L742 162" fill="none" stroke="#8d8d8d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="758" y="118" width="122" height="94" rx="10" fill="#f5f3ee" stroke="#b3ab9c" stroke-width="1.5"/>
  <rect x="744" y="149" width="16" height="26" rx="3" fill="#c0392b"/>
  <rect x="780" y="138" width="30" height="24" rx="3" fill="#3f4a54"/>
  <rect x="828" y="144" width="22" height="18" rx="3" fill="#3f4a54"/>
  <text x="819" y="192" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle">ENV Ⅲ</text>
  <text x="819" y="230" font-size="11" fill="#555" text-anchor="middle">温度・湿度・気圧</text>

  <!-- grove B to external unit -->
  <path d="M694 303 L716 303 L716 322 L748 322" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M694 303 L716 303 L716 322 L748 322" fill="none" stroke="#8d8d8d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- external power unit group -->
  <rect x="736" y="256" width="196" height="238" rx="10" fill="#fbfaf7" stroke="#9aa0a8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="834" y="278" font-size="12" font-weight="700" fill="#555" text-anchor="middle">外部電源ユニット（詳細は図2）</text>
  <rect x="750" y="290" width="168" height="66" rx="5" fill="#ece8de" stroke="#c9c2b1"/>
  <line x1="758" y1="300" x2="910" y2="300" stroke="#d64b3c" stroke-width="1.4"/>
  <line x1="758" y1="348" x2="910" y2="348" stroke="#3b6ea8" stroke-width="1.4"/>
  <rect x="758" y="310" width="152" height="30" fill="url(#holes3)"/>
  <rect x="778" y="312" width="20" height="26" rx="4" fill="#2c3a4a"/>
  <rect x="836" y="318" width="34" height="11" rx="5" fill="#d9c8a0" stroke="#b09f78"/>
  <rect x="750" y="382" width="74" height="42" rx="7" fill="#454b54"/>
  <text x="787" y="402" font-size="10" fill="#ffffff" text-anchor="middle">USB AC</text>
  <text x="787" y="416" font-size="10" fill="#cfd4da" text-anchor="middle">5V / 2A</text>
  <path d="M787 382 L787 366 L800 366 L800 356" fill="none" stroke="#7f7f7f" stroke-width="4"/>
  <rect x="846" y="382" width="72" height="62" rx="7" fill="#2e86c1"/>
  <rect x="846" y="400" width="72" height="28" fill="#256fa3"/>
  <circle cx="882" cy="378" r="11" fill="#e8e8e8" stroke="#aaa"/>
  <line x1="882" y1="378" x2="882" y2="356" stroke="#e8e8e8" stroke-width="5" stroke-linecap="round"/>
  <text x="882" y="462" font-size="12" font-weight="700" fill="#1c1c1c" text-anchor="middle">SG92R</text>
  <path d="M878 356 L878 374" fill="none" stroke="#7f7f7f" stroke-width="4"/>

  <!-- flow legend -->
  <rect x="30" y="504" width="900" height="34" rx="6" fill="#f2f4f7"/>
  <text x="46" y="526" font-size="12.5" fill="#1c1c1c">① ENV Ⅲ が測定 → ② Core2 が JSON で送信 → ③ Chrome が受信 → ④ Gemini Nano が判断 → ⑤ 角度コマンドを返信 → ⑥ サーボが動く</text>
</svg>
