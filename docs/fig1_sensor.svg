<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#1c1c1c">図1　温湿度センサーの接続（HO-2 完成図）</text>

  <!-- Grove cable -->
  <path d="M190 96 L190 66 L520 66 L520 203 L546 203" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190 96 L190 66 L520 66 L520 203 L546 203" fill="none" stroke="#8d8d8d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- base -->
  <rect x="78" y="298" width="224" height="58" rx="12" fill="#565d67"/>
  <rect x="66" y="312" width="14" height="28" rx="3" fill="#242424"/>
  <rect x="300" y="312" width="14" height="28" rx="3" fill="#2c5fa8"/>
  <!-- core body -->
  <rect x="90" y="108" width="200" height="200" rx="16" fill="#383d45"/>
  <rect x="110" y="132" width="160" height="126" rx="6" fill="#0d1218"/>
  <text x="190" y="180" font-size="27" font-weight="700" fill="#5fd3f3" text-anchor="middle">24.8 °C</text>
  <text x="190" y="216" font-size="22" font-weight="700" fill="#7ce0b0" text-anchor="middle">52.3 %</text>
  <rect x="115" y="275" width="44" height="10" rx="5" fill="#6c737c"/>
  <rect x="168" y="275" width="44" height="10" rx="5" fill="#6c737c"/>
  <rect x="221" y="275" width="44" height="10" rx="5" fill="#6c737c"/>
  <!-- PORT A -->
  <rect x="165" y="94" width="50" height="16" rx="3" fill="#c0392b"/>
  <text x="190" y="392" font-size="14" font-weight="600" fill="#1c1c1c" text-anchor="middle">M5Stack Core2 for AWS</text>

  <!-- ENV III unit -->
  <rect x="560" y="148" width="140" height="112" rx="10" fill="#f5f3ee" stroke="#b3ab9c" stroke-width="1.5"/>
  <rect x="546" y="190" width="16" height="28" rx="3" fill="#c0392b"/>
  <rect x="584" y="170" width="34" height="26" rx="3" fill="#3f4a54"/>
  <rect x="638" y="176" width="24" height="20" rx="3" fill="#3f4a54"/>
  <text x="630" y="232" font-size="16" font-weight="700" fill="#1c1c1c" text-anchor="middle">ENV Ⅲ</text>
  <text x="630" y="286" font-size="13" fill="#333">SHT30 → 0x44（温湿度）</text>
  <text x="630" y="308" font-size="13" fill="#333">QMP6988 → 0x70（気圧）</text>
  <line x1="630" y1="262" x2="630" y2="272" stroke="#999" stroke-width="1"/>

  <!-- annotations -->
  <text x="316" y="60" font-size="13" font-weight="700" fill="#c0392b">PORT.A（本体上部・赤いコネクタ）</text>
  <text x="316" y="82" font-size="13" fill="#333">I2C　G32 = SDA ／ G33 = SCL</text>
  <text x="316" y="112" font-size="12" fill="#666">Groveケーブル 4線</text>
  <text x="316" y="130" font-size="12" fill="#666">黄=SDA　白=SCL　赤=5V　黒=GND</text>

  <line x1="240" y1="102" x2="310" y2="56" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="60" y="404" width="680" height="26" rx="6" fill="#f2f4f7"/>
  <text x="74" y="422" font-size="13" fill="#1c1c1c">確認方法：i2c.scan() の一覧に <tspan font-weight="700">0x44</tspan> と <tspan font-weight="700">0x70</tspan> が含まれていればOK（他のアドレスが多数出るのは正常）</text>
</svg>
