<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#1c1c1c">図4　パルス幅と回転角の対応（HO-3 の校正）</text>

  <!-- period bracket -->
  <line x1="150" y1="88" x2="650" y2="88" stroke="#555" stroke-width="1.4" marker-start="url(#a4)" marker-end="url(#a4)"/>
  <text x="400" y="78" font-size="13" font-weight="700" fill="#333" text-anchor="middle">PWM 周期 20 ms（50 Hz）</text>
  <line x1="150" y1="96" x2="150" y2="378" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="650" y1="96" x2="650" y2="378" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- row 1 : 0.5ms -->
  <path d="M150 150 L150 104 L162.5 104 L162.5 150 L650 150" fill="none" stroke="#2e86c1" stroke-width="2.6" stroke-linejoin="round"/>
  <text x="140" y="132" font-size="14" font-weight="700" fill="#1c1c1c" text-anchor="end">0.5 ms</text>
  <text x="140" y="152" font-size="13" fill="#555" text-anchor="end">→ 0°</text>
  <circle cx="730" cy="126" r="30" fill="#f4f6f8" stroke="#b9c2cb"/>
  <path d="M700 126 A30 30 0 0 1 760 126" fill="none" stroke="#d5dce2" stroke-width="5"/>
  <line x1="730" y1="126" x2="702" y2="126" stroke="#d64b3c" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="730" cy="126" r="3.6" fill="#333"/>

  <!-- row 2 : 1.45ms -->
  <path d="M150 260 L150 214 L186 214 L186 260 L650 260" fill="none" stroke="#2e86c1" stroke-width="2.6" stroke-linejoin="round"/>
  <text x="140" y="242" font-size="14" font-weight="700" fill="#1c1c1c" text-anchor="end">1.45 ms</text>
  <text x="140" y="262" font-size="13" fill="#555" text-anchor="end">→ 90°</text>
  <circle cx="730" cy="236" r="30" fill="#f4f6f8" stroke="#b9c2cb"/>
  <path d="M700 236 A30 30 0 0 1 760 236" fill="none" stroke="#d5dce2" stroke-width="5"/>
  <line x1="730" y1="236" x2="730" y2="208" stroke="#d64b3c" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="730" cy="236" r="3.6" fill="#333"/>

  <!-- row 3 : 2.4ms -->
  <path d="M150 370 L150 324 L210 324 L210 370 L650 370" fill="none" stroke="#2e86c1" stroke-width="2.6" stroke-linejoin="round"/>
  <text x="140" y="352" font-size="14" font-weight="700" fill="#1c1c1c" text-anchor="end">2.4 ms</text>
  <text x="140" y="372" font-size="13" fill="#555" text-anchor="end">→ 180°</text>
  <circle cx="730" cy="346" r="30" fill="#f4f6f8" stroke="#b9c2cb"/>
  <path d="M700 346 A30 30 0 0 1 760 346" fill="none" stroke="#d5dce2" stroke-width="5"/>
  <line x1="730" y1="346" x2="758" y2="346" stroke="#d64b3c" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="730" cy="346" r="3.6" fill="#333"/>

  <text x="230" y="120" font-size="11.5" fill="#666">正パルスの「幅」だけで角度が決まる（周期は常に 20 ms）</text>

  <rect x="30" y="398" width="780" height="56" rx="6" fill="#f2f4f7"/>
  <text x="46" y="420" font-size="12.5" fill="#1c1c1c">MicroPython では <tspan font-family="monospace" font-weight="700">duty_ns()</tspan> でパルス幅をナノ秒指定する（<tspan font-family="monospace">duty()</tspan> は分解能不足で動きがカクつく）。</text>
  <text x="46" y="442" font-size="12.5" fill="#1c1c1c">両端の値には個体差があるため、PULSE_MIN_US / PULSE_MAX_US を各自の実機で探すところまでを演習に含める。</text>
</svg>
