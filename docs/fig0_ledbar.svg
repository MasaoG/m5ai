<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fe08a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2fbf66" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#1c1c1c">図0　LED バーの位置（HO-1 完成図）</text>
  <text x="30" y="58" font-size="13" fill="#555">ベース側面に内蔵されているため、配線は不要です。USB ケーブルだけ繋げば動きます。</text>

  <!-- PC -->
  <rect x="42" y="150" width="150" height="96" rx="7" fill="#2b3038"/>
  <rect x="52" y="160" width="130" height="76" rx="3" fill="#f8f8f6"/>
  <polygon points="30,246 204,246 216,262 18,262" fill="#3b4149"/>
  <text x="117" y="284" font-size="13" font-weight="600" fill="#1c1c1c" text-anchor="middle">PC</text>

  <!-- USB cable -->
  <path d="M218 200 L296 200" fill="none" stroke="#8d8d8d" stroke-width="7" stroke-linecap="round"/>
  <text x="257" y="188" font-size="12" font-weight="700" fill="#333" text-anchor="middle">USB</text>
  <text x="257" y="224" font-size="11" fill="#666" text-anchor="middle">給電と書き込み</text>

  <!-- Core2 body -->
  <rect x="300" y="96" width="200" height="200" rx="16" fill="#383d45"/>
  <rect x="320" y="118" width="160" height="128" rx="6" fill="#0d1218"/>
  <text x="400" y="172" font-size="21" font-weight="700" fill="#5fd3f3" text-anchor="middle">Lチカ</text>
  <text x="400" y="204" font-size="14" fill="#7ce0b0" text-anchor="middle">rgb25</text>
  <rect x="326" y="264" width="44" height="10" rx="5" fill="#6c737c"/>
  <rect x="378" y="264" width="44" height="10" rx="5" fill="#6c737c"/>
  <rect x="430" y="264" width="44" height="10" rx="5" fill="#6c737c"/>

  <!-- base -->
  <rect x="288" y="296" width="224" height="52" rx="11" fill="#565d67"/>

  <!-- LED bar on base side (right) : 10 LEDs -->
  <rect x="512" y="300" width="16" height="44" rx="5" fill="#3d434b"/>
  <g>
    <rect x="514" y="303" width="12" height="38" rx="4" fill="url(#glow)"/>
  </g>
  <!-- left side bar -->
  <rect x="272" y="300" width="16" height="44" rx="5" fill="#3d434b"/>
  <rect x="274" y="303" width="12" height="38" rx="4" fill="url(#glow)"/>

  <!-- 10 LED detail callout -->
  <rect x="560" y="120" width="210" height="150" rx="10" fill="#fbfaf7" stroke="#c9c2b1" stroke-width="1.5"/>
  <text x="665" y="146" font-size="13" font-weight="700" fill="#1c1c1c" text-anchor="middle">SK6812 × 10 個</text>
  <g>
    <rect x="580" y="162" width="170" height="26" rx="6" fill="#2b3038"/>
  </g>
  <g fill="url(#glow)">
    <circle cx="592" cy="175" r="6"/><circle cx="610" cy="175" r="6"/><circle cx="628" cy="175" r="6"/>
    <circle cx="646" cy="175" r="6"/><circle cx="664" cy="175" r="6"/><circle cx="682" cy="175" r="6"/>
    <circle cx="700" cy="175" r="6"/><circle cx="718" cy="175" r="6"/><circle cx="736" cy="175" r="6"/>
  </g>
  <circle cx="754" cy="175" r="6" fill="#3d434b"/>
  <text x="665" y="212" font-size="12" fill="#333" text-anchor="middle">データ線 = <tspan font-weight="700">G25</tspan></text>
  <text x="665" y="234" font-size="11.5" fill="#555" text-anchor="middle">すりガラス状の導光材ごしに光る</text>
  <text x="665" y="254" font-size="11.5" fill="#555" text-anchor="middle">0〜100% で明るさを指定</text>
  <line x1="532" y1="318" x2="556" y2="240" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ports untouched -->
  <rect x="375" y="82" width="50" height="16" rx="3" fill="#c0392b"/>
  <text x="400" y="72" font-size="11.5" fill="#999" text-anchor="middle">PORT.A（HO-1 では未使用）</text>
  <rect x="500" y="196" width="14" height="42" rx="3" fill="#242424"/>
  <text x="524" y="222" font-size="11.5" fill="#999">PORT.B（未使用）</text>

  <text x="400" y="374" font-size="14" font-weight="600" fill="#1c1c1c" text-anchor="middle">M5Stack Core2 for AWS ＋ M5GO-Bottom For AWS</text>

  <rect x="30" y="316" width="230" height="54" rx="6" fill="#fdf2e3" stroke="#e8c9a0"/>
  <text x="44" y="338" font-size="12" font-weight="700" fill="#8a5a1c">明るさは 12% 程度で十分</text>
  <text x="44" y="358" font-size="11.5" fill="#8a5a1c">白100%×10個は約600mA</text>
</svg>
