<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#1c1c1c">図5　Pan-Tilt の接続（HO-6 完成図・Groveハブ不使用）</text>
  <text x="30" y="57" font-size="13" fill="#555">PORT.A と PORT.C を独立した I2C バスとして使います。アドレスが衝突しません。</text>

  <!-- ===== Core2 ===== -->
  <rect x="42" y="330" width="196" height="44" rx="10" fill="#565d67"/>
  <rect x="50" y="140" width="180" height="192" rx="14" fill="#383d45"/>
  <rect x="68" y="160" width="144" height="110" rx="6" fill="#0d1218"/>
  <text x="140" y="196" font-size="15" font-weight="700" fill="#5fd3f3" text-anchor="middle">PAN 120°</text>
  <text x="140" y="224" font-size="15" font-weight="700" fill="#7ce0b0" text-anchor="middle">TILT 95°</text>
  <text x="140" y="250" font-size="12" fill="#aaa" text-anchor="middle">24.8℃ 52.3%</text>
  <rect x="72" y="288" width="34" height="9" rx="4.5" fill="#6c737c"/>
  <rect x="118" y="288" width="34" height="9" rx="4.5" fill="#6c737c"/>
  <rect x="164" y="288" width="34" height="9" rx="4.5" fill="#6c737c"/>
  <text x="140" y="398" font-size="14" font-weight="600" fill="#1c1c1c" text-anchor="middle">M5Stack Core2 for AWS</text>

  <!-- PORT.A connector (top, red) -->
  <rect x="115" y="124" width="50" height="16" rx="3" fill="#c0392b"/>
  <!-- PORT.C connector (side, blue) -->
  <rect x="230" y="240" width="14" height="46" rx="3" fill="#2c5fa8"/>
  <!-- PORT.B connector (side, black) unused here -->
  <rect x="230" y="176" width="14" height="42" rx="3" fill="#242424"/>
  <text x="252" y="200" font-size="11" fill="#999">PORT.B（サーボ用）</text>

  <!-- ===== Bus 0 : PORT.A -> ENV III ===== -->
  <rect x="300" y="80" width="620" height="120" rx="10" fill="#f6faf8" stroke="#a8cfbd" stroke-width="1.5"/>
  <text x="318" y="104" font-size="12.5" font-weight="700" fill="#2a6b4f">バス0　I2C(0)　PORT.A　G32=SDA / G33=SCL</text>

  <path d="M140 124 L140 96 L330 96 L330 140 L392 140" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M140 124 L140 96 L330 96 L330 140 L392 140" fill="none" stroke="#8d8d8d" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="352" y="88" font-size="11.5" fill="#555">Groveケーブル</text>

  <rect x="406" y="112" width="140" height="76" rx="10" fill="#f5f3ee" stroke="#b3ab9c" stroke-width="1.5"/>
  <rect x="392" y="132" width="16" height="24" rx="3" fill="#c0392b"/>
  <rect x="428" y="126" width="30" height="22" rx="3" fill="#3f4a54"/>
  <rect x="478" y="130" width="20" height="16" rx="3" fill="#3f4a54"/>
  <text x="476" y="172" font-size="14" font-weight="700" fill="#1c1c1c" text-anchor="middle">ENV Ⅲ</text>
  <text x="600" y="138" font-size="12.5" fill="#1c1c1c">SHT30 → <tspan font-weight="700">0x44</tspan>（温湿度）</text>
  <text x="600" y="162" font-size="12.5" fill="#1c1c1c">QMP6988 → <tspan font-weight="700">0x70</tspan>（気圧）</text>
  <text x="600" y="184" font-size="11" fill="#2a6b4f">このバスには 0x70 が1つだけ</text>

  <!-- ===== Bus 1 : PORT.C -> PCA9685 ===== -->
  <rect x="300" y="222" width="620" height="150" rx="10" fill="#f5f7fc" stroke="#aab9d8" stroke-width="1.5"/>
  <text x="318" y="246" font-size="12.5" font-weight="700" fill="#33508c">バス1　I2C(1)　PORT.C　G14=SDA / G13=SCL</text>

  <path d="M244 263 L330 263 L330 300 L360 300" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M244 263 L330 263 L330 300 L360 300" fill="none" stroke="#8d8d8d" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cut marker -->
  <circle cx="330" cy="281" r="9" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <path d="M326 277 L334 285 M334 277 L326 285" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
  <text x="346" y="266" font-size="11" font-weight="700" fill="#c0392b">赤線（5V）は切断</text>

  <!-- level shifter -->
  <rect x="360" y="272" width="120" height="56" rx="8" fill="#fbfaf7" stroke="#9aa0a8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="420" y="296" font-size="12" font-weight="700" fill="#1c1c1c" text-anchor="middle">レベルシフター</text>
  <text x="420" y="316" font-size="10.5" fill="#a02c1c" text-anchor="middle">バスが5Vのときのみ</text>

  <path d="M480 300 L516 300" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M480 300 L516 300" fill="none" stroke="#8d8d8d" stroke-width="6.5" stroke-linecap="round"/>

  <!-- PCA board -->
  <rect x="518" y="262" width="164" height="76" rx="8" fill="#1f6b45"/>
  <rect x="530" y="276" width="32" height="24" rx="3" fill="#111"/>
  <text x="614" y="292" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Pan-Tilt 制御基板</text>
  <text x="614" y="312" font-size="11.5" fill="#bfe0cd" text-anchor="middle">PCA9685系　<tspan font-weight="700">0x40</tspan></text>
  <text x="614" y="330" font-size="10.5" fill="#cfe8da" text-anchor="middle">All Call 0x70 もこのバス内</text>
  <text x="760" y="292" font-size="11.5" fill="#33508c">バスが分かれているので</text>
  <text x="760" y="312" font-size="11.5" fill="#33508c">0x70 が衝突しません</text>

  <!-- servos -->
  <path d="M682 280 L712 280 L712 264 L742 264" fill="none" stroke="#8d8d8d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M682 318 L724 318 L724 420 L742 420" fill="none" stroke="#8d8d8d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="746" y="232" width="96" height="62" rx="8" fill="#2e86c1"/>
  <rect x="746" y="250" width="96" height="26" fill="#256fa3"/>
  <circle cx="794" cy="228" r="12" fill="#e8e8e8" stroke="#aaa"/>
  <line x1="794" y1="228" x2="794" y2="206" stroke="#e8e8e8" stroke-width="5.5" stroke-linecap="round"/>
  <text x="794" y="312" font-size="12" font-weight="700" fill="#1c1c1c" text-anchor="middle">パン（CH0）</text>

  <rect x="746" y="392" width="96" height="62" rx="8" fill="#2e86c1"/>
  <rect x="746" y="410" width="96" height="26" fill="#256fa3"/>
  <circle cx="794" cy="388" r="12" fill="#e8e8e8" stroke="#aaa"/>
  <line x1="794" y1="388" x2="816" y2="388" stroke="#e8e8e8" stroke-width="5.5" stroke-linecap="round"/>
  <text x="794" y="472" font-size="12" font-weight="700" fill="#1c1c1c" text-anchor="middle">チルト（CH1）</text>
  <text x="794" y="492" font-size="10.5" fill="#a02c1c" text-anchor="middle">定格 3.6〜4.8V</text>

  <!-- power -->
  <rect x="360" y="430" width="160" height="56" rx="10" fill="#454b54"/>
  <rect x="342" y="446" width="20" height="24" rx="4" fill="#6d747d"/>
  <text x="440" y="454" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">USB ACアダプター</text>
  <text x="440" y="474" font-size="11" fill="#cfd4da" text-anchor="middle">サーボ電源 4.8〜5V</text>

  <path d="M520 446 L566 446 L566 344" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520 446 L566 446 L566 344" fill="none" stroke="#d64b3c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520 470 L606 470 L606 344" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520 470 L606 470 L606 344" fill="none" stroke="#2a2a2a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="566" y1="400" x2="580" y2="400" stroke="#9a9a9a" stroke-width="2.5"/>
  <line x1="592" y1="400" x2="606" y2="400" stroke="#9a9a9a" stroke-width="2.5"/>
  <line x1="580" y1="390" x2="580" y2="410" stroke="#2c3a4a" stroke-width="3"/>
  <line x1="592" y1="390" x2="592" y2="410" stroke="#2c3a4a" stroke-width="3"/>
  <text x="586" y="428" font-size="11" fill="#1c1c1c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">470〜1000µF</text>
  <text x="660" y="446" font-size="11" fill="#555">共通GND は Grove の黒線経由</text>

  <!-- notes -->
  <rect x="30" y="510" width="900" height="72" rx="6" fill="#f2f4f7"/>
  <text x="46" y="532" font-size="12.5" fill="#1c1c1c">① PORT.B（G26/G36）は I2C に使えません。G36 が入力専用のため、双方向の SDA を割り当てられないためです。</text>
  <text x="46" y="554" font-size="12.5" fill="#1c1c1c">② PORT.C のピン割り当ては実機で確認してください（黄=1番ピン=G14 を SDA と想定）。</text>
  <text x="46" y="576" font-size="12.5" font-weight="700" fill="#a02c1c">③ 接続前に SDA / SCL のアイドル電圧をテスターで実測。5V ならレベルシフター必須（ESP32 は5Vトレラントではない）。</text>
</svg>
