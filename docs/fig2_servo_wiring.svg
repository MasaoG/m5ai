<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="holes" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.1" fill="#c6bfae"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="880" height="530" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#1c1c1c">図2　サーボの外部電源配線（HO-3 完成図）</text>

  <!-- breadboard -->
  <rect x="300" y="140" width="400" height="250" rx="8" fill="#ece8de" stroke="#c9c2b1" stroke-width="1.5"/>
  <line x1="315" y1="165" x2="685" y2="165" stroke="#d64b3c" stroke-width="1.6"/>
  <line x1="315" y1="365" x2="685" y2="365" stroke="#3b6ea8" stroke-width="1.6"/>
  <text x="308" y="158" font-size="11" fill="#d64b3c" font-weight="700">＋5V ライン</text>
  <text x="308" y="382" font-size="11" fill="#3b6ea8" font-weight="700">GND ライン</text>
  <rect x="315" y="195" width="370" height="140" fill="url(#holes)"/>
  <rect x="315" y="258" width="370" height="14" fill="#e3ddd0"/>

  <!-- capacitor -->
  <line x1="348" y1="288" x2="348" y2="165" stroke="#9a9a9a" stroke-width="2.5"/>
  <line x1="370" y1="334" x2="370" y2="365" stroke="#9a9a9a" stroke-width="2.5"/>
  <rect x="336" y="288" width="46" height="46" rx="9" fill="#2c3a4a"/>
  <rect x="336" y="288" width="12" height="46" rx="6" fill="#9fb0c0"/>
  <text x="342" y="316" font-size="11" fill="#2c3a4a" font-weight="700">−</text>

  <!-- resistor -->
  <line x1="450" y1="250" x2="470" y2="250" stroke="#9a9a9a" stroke-width="2.5"/>
  <line x1="528" y1="250" x2="548" y2="250" stroke="#9a9a9a" stroke-width="2.5"/>
  <rect x="470" y="242" width="58" height="17" rx="8" fill="#d9c8a0" stroke="#b09f78"/>
  <rect x="479" y="242" width="5" height="17" fill="#d95f2b"/>
  <rect x="489" y="242" width="5" height="17" fill="#333"/>
  <rect x="499" y="242" width="5" height="17" fill="#8a5a2b"/>
  <rect x="514" y="242" width="5" height="17" fill="#c9a227"/>

  <!-- USB adapter -->
  <rect x="50" y="60" width="180" height="64" rx="10" fill="#454b54"/>
  <rect x="30" y="78" width="22" height="28" rx="4" fill="#6d747d"/>
  <text x="140" y="88" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">USB ACアダプタ</text>
  <text x="140" y="108" font-size="12" fill="#cfd4da" text-anchor="middle">5V / 2A 以上</text>

  <!-- Core2 -->
  <rect x="42" y="394" width="196" height="42" rx="10" fill="#565d67"/>
  <rect x="50" y="200" width="180" height="200" rx="14" fill="#383d45"/>
  <rect x="68" y="220" width="144" height="112" rx="6" fill="#0d1218"/>
  <text x="140" y="268" font-size="17" font-weight="700" fill="#5fd3f3" text-anchor="middle">SERVO</text>
  <text x="140" y="296" font-size="15" fill="#7ce0b0" text-anchor="middle">90°</text>
  <rect x="72" y="352" width="38" height="9" rx="4.5" fill="#6c737c"/>
  <rect x="121" y="352" width="38" height="9" rx="4.5" fill="#6c737c"/>
  <rect x="170" y="352" width="38" height="9" rx="4.5" fill="#6c737c"/>
  <rect x="230" y="238" width="14" height="46" rx="3" fill="#242424"/>
  <text x="140" y="462" font-size="14" font-weight="600" fill="#1c1c1c" text-anchor="middle">M5Stack Core2 for AWS</text>

  <!-- wires: halo first -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 82 L400 82 L400 165"/>
    <path d="M60 124 L36 124 L36 470 L440 470 L440 365"/>
    <path d="M244 250 L450 250"/>
    <path d="M244 272 L292 272 L292 376 L400 376 L400 365"/>
    <path d="M548 250 L700 250 L700 272 L736 272"/>
    <path d="M620 165 L718 165 L718 292 L736 292"/>
    <path d="M600 365 L728 365 L728 312 L736 312"/>
  </g>
  <path d="M230 82 L400 82 L400 165" fill="none" stroke="#d64b3c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 124 L36 124 L36 470 L440 470 L440 365" fill="none" stroke="#2a2a2a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M244 250 L450 250" fill="none" stroke="#e2b423" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M244 272 L292 272 L292 376 L400 376 L400 365" fill="none" stroke="#2a2a2a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M548 250 L700 250 L700 272 L736 272" fill="none" stroke="#e07b20" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M620 165 L718 165 L718 292 L736 292" fill="none" stroke="#d64b3c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 365 L728 365 L728 312 L736 312" fill="none" stroke="#6b4a2f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- servo -->
  <rect x="736" y="230" width="112" height="100" rx="8" fill="#2e86c1"/>
  <rect x="736" y="256" width="112" height="46" fill="#256fa3"/>
  <circle cx="792" cy="226" r="15" fill="#e8e8e8" stroke="#aaa"/>
  <line x1="792" y1="226" x2="792" y2="188" stroke="#e8e8e8" stroke-width="7" stroke-linecap="round"/>
  <circle cx="792" cy="188" r="5" fill="#cccccc"/>
  <text x="792" y="352" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle">SG92R</text>

  <!-- labels -->
  <g font-size="12" fill="#1c1c1c" paint-order="stroke" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round">
    <text x="256" y="238" font-weight="700">PORT.B 1番ピン ＝ G26（信号・黄）</text>
    <text x="300" y="300">PORT.B 4番ピン ＝ GND（黒）</text>
    <text x="404" y="322">電解コンデンサ 1000µF</text>
    <text x="499" y="230" text-anchor="middle" font-weight="700">330 Ω</text>
    <text x="756" y="212" font-size="11">橙＝信号</text>
    <text x="600" y="196" font-size="11">赤＝5V</text>
    <text x="600" y="392" font-size="11">茶＝GND</text>
  </g>

  <rect x="30" y="486" width="820" height="30" rx="6" fill="#fdf0ee" stroke="#e8b6ae"/>
  <text x="44" y="506" font-size="13" fill="#a02c1c" font-weight="700">注意：Grove変換ケーブルの赤線（5V）は使用しない。M5Stack から取るのは G26（信号）と GND の2本だけ。</text>
</svg>
