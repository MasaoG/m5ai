<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<text x="30" y="36" font-size="20" font-weight="700" fill="#1c1c1c" text-anchor="start">図7　HO-4 の完成図</text>
<text x="30" y="60" font-size="13" font-weight="400" fill="#6c737c" text-anchor="start">ブラウザーが「自分で書いたルール」で判断する</text>
<line x1="30" y1="74" x2="930" y2="74" stroke="#c9c2b1" stroke-width="1"/>
<rect x="30" y="96" width="330" height="372" rx="7" fill="#fcfcfb" stroke="#c9c2b1" stroke-width="1.5"/>
<text x="48" y="122" font-size="14" font-weight="700" fill="#1c1c1c" text-anchor="start">ボード側</text>
<text x="48" y="140" font-size="11" font-weight="400" fill="#6c737c" text-anchor="start">main.py が走り続けている</text>
<rect x="56" y="156" width="278" height="64" rx="7" fill="#ffffff" stroke="#c9c2b1" stroke-width="1.5"/>
<text x="72" y="180" font-size="14" font-weight="700" fill="#1c1c1c" text-anchor="start">ENV Ⅲ Unit</text>
<text x="72" y="200" font-size="10.5" font-weight="400" fill="#6c737c" text-anchor="start">PORT.A（左側面の下・赤）I2C</text>
<line x1="195" y1="220" x2="195" y2="248" stroke="#6c737c" stroke-width="2"/>
<path d="M 195 254 L 189 244 L 201 244 Z" fill="#6c737c"/>
<rect x="56" y="256" width="278" height="86" rx="7" fill="#eef4fa" stroke="#2e86c1" stroke-width="2.5"/>
<text x="72" y="282" font-size="14" font-weight="700" fill="#1c1c1c" text-anchor="start">M5Stack Core2 for AWS</text>
<text x="72" y="302" font-size="11" font-weight="400" fill="#6c737c" text-anchor="start">センサーを読む → 送る</text>
<text x="72" y="320" font-size="11" font-weight="400" fill="#6c737c" text-anchor="start">受け取る → サーボと画面に反映</text>
<line x1="195" y1="342" x2="195" y2="370" stroke="#6c737c" stroke-width="2"/>
<path d="M 195 376 L 189 366 L 201 366 Z" fill="#6c737c"/>
<rect x="56" y="378" width="133" height="70" rx="7" fill="#ffffff" stroke="#c9c2b1" stroke-width="1.5"/>
<text x="72" y="402" font-size="13" font-weight="700" fill="#1c1c1c" text-anchor="start">SG90</text>
<text x="72" y="420" font-size="10.5" font-weight="400" fill="#6c737c" text-anchor="start">PORT.B（上面の左・黒）</text>
<text x="72" y="437" font-size="11" font-weight="700" fill="#c0392b" text-anchor="start">信号は白</text>
<rect x="201" y="378" width="133" height="70" rx="7" fill="#ffffff" stroke="#c9c2b1" stroke-width="1.5"/>
<text x="217" y="402" font-size="13" font-weight="700" fill="#1c1c1c" text-anchor="start">本体の画面</text>
<text x="217" y="420" font-size="11" font-weight="400" fill="#6c737c" text-anchor="start">msg をそのまま</text>
<text x="217" y="437" font-size="11" font-weight="400" fill="#6c737c" text-anchor="start">表示する</text>
<text x="480" y="118" font-size="12" font-weight="700" fill="#1c1c1c" text-anchor="middle">USB ケーブル 1 本</text>
<text x="480" y="136" font-size="11" font-weight="400" fill="#6c737c" text-anchor="middle">（Web Serial API）</text>
<line x1="372" y1="188" x2="574" y2="188" stroke="#2e86c1" stroke-width="3" stroke-linecap="round"/><path d="M 588 188 L 574 180 L 574 196 Z" fill="#2e86c1"/><text x="480.0" y="172" font-size="12" font-weight="700" fill="#2e86c1" text-anchor="middle">① ボード → PC</text>
<rect x="378" y="200" width="204" height="30" rx="5" fill="#ffffff" stroke="#b8d4ea" stroke-width="1"/>
<text x="480" y="220" font-size="11" font-weight="400" fill="#1c1c1c" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">{"t":24.8,"h":52.3,"btn":0}</text>
<line x1="588" y1="388" x2="386" y2="388" stroke="#2e86c1" stroke-width="3" stroke-linecap="round"/><path d="M 372 388 L 386 380 L 386 396 Z" fill="#2e86c1"/><text x="480.0" y="372" font-size="12" font-weight="700" fill="#2e86c1" text-anchor="middle">② PC → ボード</text>
<rect x="378" y="400" width="204" height="30" rx="5" fill="#ffffff" stroke="#b8d4ea" stroke-width="1"/>
<text x="480" y="420" font-size="10.5" font-weight="400" fill="#1c1c1c" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">{"servo":120,"msg":"換気推奨"}</text>
<text x="480" y="452" font-size="11" font-weight="700" fill="#6c737c" text-anchor="middle">1 行に 1 つの JSON。改行が「1 件の終わり」</text>
<rect x="600" y="96" width="330" height="372" rx="7" fill="#fcfcfb" stroke="#c9c2b1" stroke-width="1.5"/>
<text x="618" y="122" font-size="14" font-weight="700" fill="#1c1c1c" text-anchor="start">PC 側（Chrome）</text>
<text x="618" y="140" font-size="11" font-weight="400" fill="#6c737c" text-anchor="start">AIブリッジページ</text>
<rect x="626" y="156" width="278" height="52" rx="7" fill="#ffffff" stroke="#c9c2b1" stroke-width="1.5"/>
<text x="642" y="178" font-size="11" font-weight="400" fill="#6c737c" text-anchor="start">受け取った値</text>
<text x="642" y="198" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="start">24.8 ℃ ／ 52.3 %</text>
<line x1="765" y1="208" x2="765" y2="213" stroke="#6c737c" stroke-width="2"/>
<path d="M 765 219 L 759 209 L 771 209 Z" fill="#6c737c"/>
<rect x="626" y="220" width="278" height="104" rx="7" fill="#f2f3f4" stroke="#9aa3ab" stroke-width="2.5"/>
<text x="642" y="244" font-size="14" font-weight="700" fill="#1c1c1c" text-anchor="start">「ロジック」タブ</text>
<text x="642" y="264" font-size="11" font-weight="400" fill="#6c737c" text-anchor="start">自分で書いた if 文</text>
<rect x="642" y="272" width="246" height="42" rx="5" fill="#ffffff" stroke="#d7dadd" stroke-width="1"/>
<text x="654" y="289" font-size="11" font-weight="400" fill="#1c1c1c" text-anchor="start" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">if (h &gt; 60) servo = 120;</text>
<text x="654" y="306" font-size="11" font-weight="400" fill="#1c1c1c" text-anchor="start" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">else            servo = 60;</text>
<line x1="765" y1="324" x2="765" y2="329" stroke="#6c737c" stroke-width="2"/>
<path d="M 765 335 L 759 325 L 771 325 Z" fill="#6c737c"/>
<rect x="626" y="336" width="278" height="52" rx="7" fill="#ffffff" stroke="#c9c2b1" stroke-width="1.5"/>
<text x="642" y="358" font-size="11" font-weight="400" fill="#6c737c" text-anchor="start">送る内容</text>
<text x="642" y="378" font-size="11" font-weight="400" fill="#1c1c1c" text-anchor="start" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">{ "servo": 120, "msg": "換気推奨" }</text>
<text x="618" y="418" font-size="11" font-weight="400" fill="#6c737c" text-anchor="start">💬 画面を見ずに、サーボの動きだけで</text>
<text x="618" y="436" font-size="11" font-weight="400" fill="#6c737c" text-anchor="start">　 分かるようにできますか？</text>
<rect x="30" y="490" width="900" height="86" rx="8" fill="#f2f3f4" stroke="#9aa3ab" stroke-width="2"/>
<text x="52" y="518" font-size="16" font-weight="700" fill="#1c1c1c" text-anchor="start">ここまでで「一周」がつながりました。</text>
<text x="52" y="542" font-size="12.5" font-weight="400" fill="#1c1c1c" text-anchor="start">現実 → センサー → USB → ブラウザー → 判断 → USB → サーボ → 現実。</text>
<text x="52" y="562" font-size="12.5" font-weight="400" fill="#1c1c1c" text-anchor="start">どこか 1 か所でも切れると動きません。判断の中身は、次の HO-5 で AI に置き換えます。</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>