<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#1c1c1c">図1　温湿度センサーの接続（HO-2 完成図）</text>

  <!-- Grove cable -->
  <path d="M78 262 L48 262 L48 66 L520 66 L520 203 L546 203" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 262 L48 262 L48 66 L520 66 L520 203 L546 203" fill="none" stroke="#8d8d8d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- base -->
  
  <!-- core body -->
  <rect x="90" y="108" width="200" height="200" rx="16" fill="#f2a62b"/>
  <rect x="98" y="116" width="184" height="184" rx="11" fill="#2b3036"/>
  <circle cx="137" cy="280" r="8" fill="none" stroke="#767d86" stroke-width="1.6"/>
  <circle cx="190" cy="280" r="8" fill="none" stroke="#767d86" stroke-width="1.6"/>
  <circle cx="243" cy="280" r="8" fill="none" stroke="#767d86" stroke-width="1.6"/>
  <rect x="110" y="132" width="160" height="126" rx="6" fill="#0d1218"/>
  <text x="190" y="180" font-size="27" font-weight="700" fill="#5fd3f3" text-anchor="middle">24.8 °C</text>
  <text x="190" y="216" font-size="22" font-weight="700" fill="#7ce0b0" text-anchor="middle">52.3 %</text>
  <!-- PORT.B（上面の左・黒／今回は未使用） -->
  <rect x="112" y="92" width="44" height="18" rx="3" fill="#242424"/>
  <text x="134" y="126" font-size="10.5" font-weight="700" fill="#9aa0a8" text-anchor="middle">PORT.B</text>
  <!-- PORT.C（上面の右・青／今回は未使用） -->
  <rect x="224" y="92" width="44" height="18" rx="3" fill="#2c5fa8"/>
  <text x="246" y="126" font-size="10.5" font-weight="700" fill="#9aa0a8" text-anchor="middle">PORT.C</text>
  <!-- PORT.A（左側面の下・赤／今回使用） -->
  <rect x="76" y="242" width="18" height="40" rx="3" fill="#c0392b"/>
  <text x="70" y="300" font-size="11.5" font-weight="700" fill="#c0392b" text-anchor="end">PORT.A</text>
  <text x="190" y="344" font-size="14" font-weight="600" fill="#1c1c1c" text-anchor="middle">M5Stack Core2 for AWS</text>

  <!-- ENV III unit -->
  <rect x="560" y="148" width="140" height="112" rx="10" fill="#f5f3ee" stroke="#b3ab9c" stroke-width="1.5"/>
  <rect x="546" y="190" width="16" height="28" rx="3" fill="#c0392b"/>
  <rect x="584" y="170" width="34" height="26" rx="3" fill="#3f4a54"/>
  <rect x="638" y="176" width="24" height="20" rx="3" fill="#3f4a54"/>
  <text x="630" y="232" font-size="16" font-weight="700" fill="#1c1c1c" text-anchor="middle">ENV Ⅲ</text>
  <text x="630" y="286" font-size="13" fill="#333">SHT30 → 0x44（温湿度）</text>
  <text x="630" y="308" font-size="13" fill="#333">QMP6988 → 0x70（気圧）</text>
  <line x1="630" y1="262" x2="630" y2="272" stroke="#999" stroke-width="1"/>

  <!-- annotations -->
  <text x="316" y="60" font-size="13" font-weight="700" fill="#c0392b">PORT.A（左側面の下・赤いコネクター）</text>
  <text x="316" y="100" font-size="13" fill="#333">I2C　G32 = SDA ／ G33 = SCL</text>
  <text x="316" y="122" font-size="12" fill="#666">Groveケーブル 4線</text>
  <text x="316" y="140" font-size="12" fill="#666">黄=SDA　白=SCL</text>
  <text x="316" y="158" font-size="12" fill="#666">赤=5V　黒=GND</text>
  <text x="316" y="232" font-size="11.5" fill="#9aa0a8">上面の PORT.B（黒）・PORT.C（青）は</text>
  <text x="316" y="250" font-size="11.5" fill="#9aa0a8">HO-2 では使いません</text>

  <rect x="60" y="404" width="680" height="26" rx="6" fill="#f2f4f7"/>
  <text x="74" y="422" font-size="13" fill="#1c1c1c">確認方法：i2c.scan() の結果が <tspan font-weight="700">['0x44', '0x70']</tspan> の2つだけ。PORT.A は内蔵I2Cとは別バスです</text>
</svg>
